# Blueprint Render — UNIMPRESA Sicilia
# Crée automatiquement : 1 base PostgreSQL + 1 service web Docker.
services:
  - type: web
    name: formations-senegal-italie
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: unimpresa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: unimpresa-db
    plan: free
    databaseName: unimpresa
    user: unimpresa
